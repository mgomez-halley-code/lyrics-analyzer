version: '3.8'

services:
  # Go lyrics analyzer service
  lyrics-analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lyrics-analyzer
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - SERVER_ADDR=:8080

      # LRCLib API configuration
      - LRCLIB_BASE_URL=https://lrclib.net
      - LRCLIB_TIMEOUT=10s

      # Retry configuration
      - RETRY_MAX_RETRIES=3
      - RETRY_BACKOFF=100ms
      - RETRY_MAX_BACKOFF=5s
      - RETRY_MULTIPLIER=2.0

      # Cache configuration
      - CACHE_TYPE=redis
      - CACHE_TTL=24h

      # Redis configuration (points to redis service)
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lyrics-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: lyrics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu
    restart: unless-stopped
    networks:
      - lyrics-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis-data:
    driver: local

networks:
  lyrics-net:
    driver: bridge
